<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title th:text="${applicationName}">App</title></head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:24px 0;">
    <tr><td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
            <tr><td style="background-color:#1a237e;padding:24px;text-align:center;">
                <span style="color:#ffffff;font-size:22px;font-weight:bold;" th:text="${applicationName}">Application Name</span>
            </td></tr>
            <tr><td style="padding:32px;">
                <p style="font-size:16px;color:#1a1a1a;margin:0 0 16px;">Hello <span th:text="${userName}">User</span>,</p>
                <p style="font-size:15px;color:#333333;line-height:1.6;margin:0 0 16px;">
                    Thank you for registering with <span th:text="${applicationName}">Application Name</span>. Your account has been successfully created.
                </p>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8f9fb;border-radius:6px;margin:24px 0;">
                    <tr><td style="padding:20px;">
                        <p style="margin:0 0 12px;font-size:14px;color:#555555;font-weight:bold;">Account details</p>
                        <p style="margin:0 0 6px;font-size:14px;color:#333333;">Name: <span th:text="${userName}">-</span></p>
                        <p style="margin:0 0 6px;font-size:14px;color:#333333;">Email: <span th:text="${email}">-</span></p>
                        <p style="margin:0 0 6px;font-size:14px;color:#333333;">Role: <span th:text="${role}">-</span></p>
                        <p style="margin:0;font-size:14px;color:#333333;">Registered on: <span th:text="${registrationDate}">-</span></p>
                    </td></tr>
                </table>
                <p style="font-size:15px;color:#333333;line-height:1.6;margin:0 0 24px;">You can now log in and start using the platform.</p>
                <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="border-radius:6px;background-color:#1a237e;">
                    <a th:href="${loginUrl}" style="display:inline-block;padding:12px 28px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:bold;">Login to your account</a>
                </td></tr></table>
            </td></tr>
            <tr><td style="background-color:#f4f5f7;padding:20px;text-align:center;">
                <p style="margin:0;font-size:12px;color:#888888;" th:text="${applicationName} + ' - All rights reserved.'">Footer</p>
            </td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
